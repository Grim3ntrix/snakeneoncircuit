<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SNAKE // NEON CIRCUIT</title>
    <meta
      name="description"
      content="A framework-free retro Snake game, built for polish."
    />
    <!-- Inline, so the browser never requests a /favicon.ico that does not exist.
         A data URI cannot read a CSS custom property, so these hex values are
         copied from the palette in css/main.css and must be updated with it. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0d12'/%3E%3Crect x='7' y='13' width='7' height='7' fill='%23a8ffd8'/%3E%3Crect x='15' y='14' width='6' height='6' fill='%232fe0a0'/%3E%3Crect x='23' y='15' width='4' height='4' fill='%232fe0a0'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/main.css" />
    <script type="module" src="src/main.js"></script>
  </head>

  <body>
    <main class="shell">
      <header class="hud">
        <h1 class="title">SNAKE <span class="title__mark">//</span> NEON CIRCUIT</h1>
        <p class="stat">
          <span class="stat__label">Score</span>
          <span class="stat__value" id="score">0</span>
        </p>
      </header>

      <div class="board" id="board">
        <!-- All meaningful state is DOM text; the canvas is decoration to a
             screen reader and is hidden from it accordingly. -->
        <canvas class="board__canvas" id="game-canvas" width="288" height="288" aria-hidden="true"></canvas>

        <div class="overlay" id="overlay-ready">
          <div class="overlay__panel">
            <p class="overlay__title">Ready</p>
            <!-- One instruction per input device, and CSS picks. A keycap is an
                 instruction to press a key that does not exist on the device
                 showing it, so the whole line is replaced rather than reworded. -->
            <p class="overlay__detail overlay__detail--keys">Press <kbd>Enter</kbd> to start</p>
            <p class="overlay__detail overlay__detail--touch">Tap the pad to start</p>
            <!-- Two lines, and only ever one of them shown. The hint has to name
                 the state the key would change, and sound is on for a first visit
                 and may not be for a later one. Keyboard only: where there is a
                 button instead of a keyboard, that button already says which. -->
            <p class="overlay__detail overlay__detail--keys" id="hint-sound-on">Press <kbd>M</kbd> to mute</p>
            <p class="overlay__detail overlay__detail--keys" id="hint-sound-off" hidden>Press <kbd>M</kbd> for sound</p>
            <!-- Filled and unhidden by main.js, and only once a game has been
                 finished. Left empty and `hidden` here so a first visit — which
                 has no record to show — is exactly the screen it was before this
                 feature existed. It is not device-specific: the same figure reads
                 the same way on a phone and a desktop. -->
            <p class="overlay__meta" id="record" hidden></p>
            <!-- The music control, and the only interactive thing in any overlay.

                 Here rather than in the touch row, which 005 measured: at 320px
                 that row has 296px for a pad of 148 and two controls of about 59
                 each, so a third needs roughly 67px more than exists. Its other
                 home is worse — a 44px control in the HUD row costs the board its
                 cell size at 844x390, which 003 measured and rejected. So it goes
                 where a player already stops: before a run, during a pause, after a
                 death. `data-music` rather than an id, so input.js wires all three
                 with one query.

                 Its label is written by main.js and reports the state it is in.
                 Kept live rather than disabled while the game is muted: it is a
                 preference about the next run, not an action on this one, and on
                 the game-over screen there is no bed to hear either way. -->
            <button type="button" class="control overlay__control" data-music>Music</button>
          </div>
        </div>

        <!-- `hidden` on both, and it is load-bearing rather than tidy.
             Only the ready screen is up at load, and main.js is a module — it runs
             after the document is parsed. Without the attribute the browser paints
             first and hydrates second, and in that window all three overlays are
             `display: grid` on top of each other at the same coordinates and the
             last one in document order is what a phone shows: a full "Game over —
             Attempts 0" screen, for as long as the module takes to arrive. On a
             phone that is long enough to read. The attribute makes the first paint
             the right one, and main.js only ever reveals an overlay from here. -->
        <div class="overlay" id="overlay-paused" aria-live="polite" hidden>
          <div class="overlay__panel">
            <p class="overlay__title">Paused</p>
            <p class="overlay__detail overlay__detail--keys">Press <kbd>P</kbd> or <kbd>Escape</kbd> to resume</p>
            <p class="overlay__detail overlay__detail--touch">Tap Pause to resume</p>
            <button type="button" class="control overlay__control" data-music>Music</button>
          </div>
        </div>

        <div class="overlay" id="overlay-over" aria-live="polite" hidden>
          <div class="overlay__panel">
            <p class="overlay__title" id="over-title">Game over</p>
            <p class="overlay__detail" id="over-detail">Score 0</p>
            <!-- How many runs this session has ended, filled by main.js. Not a
                 record and not stored: reloading puts it back to one. -->
            <p class="overlay__meta" id="over-attempts">Attempts 0</p>
            <p class="overlay__detail overlay__detail--keys">Press <kbd>Enter</kbd> to play again</p>
            <p class="overlay__detail overlay__detail--touch">Tap the pad to play again</p>
            <button type="button" class="control overlay__control" data-music>Music</button>
          </div>
        </div>
      </div>

      <!-- Touch controls. Sized and placed by CSS, which is also where the
           `pointer: coarse` decision lives — nothing here is detected at runtime.
           A sibling of .board, never a child: .board is the element the renderer
           measures, and putting controls inside it would let them shrink the
           board they are meant to serve.

           Both controls sit with the pad rather than in the HUD row. Pause was
           specified for the HUD, but measured: a 44px control in the 40px HUD row
           grows that row by 17px, which at 480x720 leaves the board 3px of slack
           and at 844x390 drops the cell size from 12 to 11. The board does not get
           smaller to make room for a button, and the same arithmetic settles the
           sound control: it is here, or it is a key.

           And they sit beside the pad rather than on a row with it, one above
           the other, so the pad's nearest neighbour is diagonal instead of
           adjacent: a thumb that overshoots the pad's right key travels into the
           gap rather than onto a button. The row still costs the board nothing,
           because the pair is 104px tall against the pad's 148 — the pad is still
           what sizes the row, at every viewport.

           Its label is written by main.js and reports the state it is in, so the
           one control that produces silence is never the one thing that cannot
           confirm it did something. -->
      <div class="controls">
        <div class="pad" id="pad" role="group" aria-label="Direction">
          <!-- tabindex="-1": these are for a finger. The arrow keys already reach
               the same four intents, so nothing is lost from the tab order, and a
               focused direction button is a button that can be activated by the
               same Enter key that starts a game. -->
          <button type="button" class="pad__key pad__key--up" data-direction="up" tabindex="-1" aria-label="Up"><span class="pad__chevron"></span></button>
          <button type="button" class="pad__key pad__key--left" data-direction="left" tabindex="-1" aria-label="Left"><span class="pad__chevron"></span></button>
          <button type="button" class="pad__key pad__key--right" data-direction="right" tabindex="-1" aria-label="Right"><span class="pad__chevron"></span></button>
          <button type="button" class="pad__key pad__key--down" data-direction="down" tabindex="-1" aria-label="Down"><span class="pad__chevron"></span></button>
        </div>
        <!-- Sound above Pause, which is left over from the first attempt at this and
             is kept rather than churned. It was the whole fix once — a thumb that
             overshot the pad used to land on whichever control was nearest, and
             Sound is the one that is safe to hit by accident. Stacked and centred on
             the pad, the two are now exactly equidistant from it, so the order
             decides nothing; the 32px gap and the dead lane do. Sorting them the
             other way would be a change with no measurement behind it. -->
        <div class="controls__neighbours">
          <button type="button" class="control" id="sound">Sound</button>
          <button type="button" class="control" id="pause">Pause</button>
        </div>
      </div>
    </main>
  </body>
</html>
